services:
  # Backend Service
  - type: web
    name: healsync-backend
    env: java
    buildCommand: cd backend && ./mvnw clean compile
    startCommand: cd backend && ./mvnw spring-boot:run
    envVars:
      - key: PORT
        value: 8081

  # Frontend Service
  - type: web
    name: healsync-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html